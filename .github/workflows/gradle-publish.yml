name: Gradle Package

on:
  workflow_call:
    inputs:
      release_version:
        description: 'Release version to publish (e.g. 1.0.0)'
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      # Check out the release tag, not the commit the tag workflow started from:
      # that commit predates the version bump, so it would publish the previous version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.release_version }}
          persist-credentials: false

      - name: Verify build version matches release
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if ! grep -qx "version = \"${RELEASE_VERSION}\"" build.gradle.kts; then
            echo "::error::Tag v${RELEASE_VERSION} contains $(grep '^version' build.gradle.kts), expected version = \"${RELEASE_VERSION}\""
            exit 1
          fi

      # gradle-wrapper.jar is a tracked binary; validating it is the line between a
      # tampered wrapper and arbitrary execution with this job's package-write token.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
