name: Gradle Package

on:
  workflow_call:
    inputs:
      release_version:
        description: 'Release version to publish (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Check out the release tag, not the commit the tag workflow started from:
      # that commit predates the version bump, so it would publish the previous version.
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.release_version }}

      - name: Verify build version matches release
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if ! grep -qx "version = \"${RELEASE_VERSION}\"" build.gradle.kts; then
            echo "::error::Tag v${RELEASE_VERSION} contains $(grep '^version' build.gradle.kts), expected version = \"${RELEASE_VERSION}\""
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
